<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/register.css">
    <title>Document</title>
</head>
<body>
    <header>Welcome to my shop</header>
    <main>
        <form action="/model/login.php" method="post">
            <div class="header_Login">Đăng nhập</div>
            <div class="login_Group">
                <label for="username">Nhập tên người dùng:</label>
                <input type="text" name="username" class="" placeholder="ex: Lê Minh Hoàng">
            </div>
            <div class="login_Group">
                <label for="password">Nhập mật khẩu:</label>
                <input type="password" name="password" class="" placeholder="ex: Abc12345.. ">
            </div>
            <a href="register.html" class="forget_Password">Bạn chưa có tài khoản?</a>
            
            <button type="submit" class="submit_Login">Đăng nhập</button>
            <span class="check_Login">Tài khoản hoặc mật khẩu không đúng vui lòng nhập lại</span>
        </form>
    </main>
</body>
</html>
