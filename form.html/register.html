<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/register.css">
    <title>Document</title>
</head>
<body>
    <header>Welcome to my shop</header>
    <main>
        <form action="/model/register.php" method="post">
            <div class="header_Register">Đăng kí</div>
            <div class="register_Group">
                <label for="username">Nhập tên người dùng:</label>
                <input type="text" name="username" class="" placeholder="ex: Lê Minh Hoàng">
            </div>
            <div class="register_Group">
                <label for="password">Nhập mật khẩu:</label>
                <input type="password" name="password" class="" placeholder="ex: Abc12345.. ">
            </div>
            <button type="submit" class="submit_Register">Đăng kí</button>
        </form>
    </main>
</body>
</html>
